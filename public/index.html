<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluxera · API Recovery Demo</title>
  <meta name="description" content="Live demonstration of API failure detection, work continuity, safe recovery and cost recovery.">
  <meta name="theme-color" content="#07090d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <a class="brand" href="#connect" aria-label="Fluxera recovery demo">
        <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8d9bff"/>
              <stop offset="1" stop-color="#5be0c8"/>
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="#10141b" stroke="#2b3441"/>
          <path d="M7 20c3.2 0 3.2-8 6.4-8s3.2 8 6.4 8 3.2-8 5.2-8" fill="none" stroke="url(#g)" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">Fluxera</span>
        <span class="brand-sub">API recovery demo</span>
      </a>
      <ol class="stepper" id="stepper" aria-label="Demo progress"></ol>
      <div class="controls" id="controls"></div>
    </div>
  </header>

  <div class="banner" role="note">
    <span class="banner-tag">Sandbox</span>
    <span>No live payments, customer messages or deletions. Simulated and estimated values are labeled wherever they appear.</span>
  </div>

  <div class="shell">
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <main class="main">
      <section class="section" id="connect"></section>
      <section class="section" id="run"></section>
      <section class="section" id="tree"></section>
      <section class="section" id="fail"></section>
      <section class="section" id="continuity"></section>
      <section class="section" id="recover"></section>
      <section class="section" id="verify"></section>
      <section class="section" id="cost"></section>
      <section class="section" id="video"></section>
      <section class="section" id="acceptance"></section>
      <footer class="foot">
        <span>Fluxera recovery demo</span>
        <span class="muted" id="foot-meta"></span>
      </footer>
    </main>
  </div>

  <div class="toast-host" id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
